<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Wi-Fi Setup</title>
<style>
 body{ background:#111; color:#eee; font-family:Arial; text-align:center; margin:30px; }
 input,button{ padding:10px 14px; margin:8px; border:none; border-radius:6px; }
 input{ background:#222; color:#fff; width:260px; }
 button{ background:#555; color:#fff; cursor:pointer; }
 a{ color:#6cf; }
</style>
</head>
<body>
<h2>Configure Wi-Fi</h2>
<p>Enter your Wi-Fi credentials below. Device will reboot after saving.</p>
<form id="w">
  <div><input name="ssid" placeholder="SSID" required></div>
  <div><input name="pass" placeholder="Password" required type="password"></div>
  <button type="submit">Save & Reboot</button>
</form>
<p><a href="/">← Back to Dashboard</a></p>

<script>
document.getElementById('w').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const fd = new FormData(e.target);
  const params = new URLSearchParams();
  params.append('ssid', fd.get('ssid'));
  params.append('pass', fd.get('pass'));
  const res = await fetch('/wifi/save', { method:'POST', body: params });
  const txt = await res.text();
  alert(txt);
});
</script>
</body>
</html>
