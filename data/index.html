<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ESP32 Dashboard</title>
<style>
  body { background:#111; color:#eee; font-family:Arial; text-align:center; margin:30px; }
  button{ background:#555; color:#fff; border:none; border-radius:6px; padding:10px 16px; margin:8px; cursor:pointer; }
  pre{ background:#000; color:#0f0; text-align:left; padding:10px; height:240px; overflow:auto; border-radius:6px; }
  #status{ margin:8px 0; font-size:14px; }
  .row{ margin:12px 0; }
  a{ color:#6cf; }
</style>
</head>
<body>
<h2>ESP32 Control Panel</h2>

<div class="row">
  <button id="btnReboot">🔁 Reboot</button>
  <button id="btnOn">💡 LED ON</button>
  <button id="btnOff">🌑 LED OFF</button>
</div>

<div class="row">
  <span id="status">🟡 Connecting...</span> ·
  <a href="/ota">OTA</a> ·
  <a href="/wifi">Wi-Fi</a>
</div>

<h3>Logs</h3>
<pre id="log"></pre>
<button onclick="document.getElementById('log').innerHTML=''">Clear</button>

<script>
let logBox = document.getElementById('log');
let statusEl = document.getElementById('status');
let ws;

function connectWS(){
  ws = new WebSocket('ws://' + window.location.hostname + ':81/');
  ws.onopen = () => { statusEl.textContent = '🟢 Connected'; };
  ws.onclose = () => { statusEl.textContent = '🔴 Disconnected — retrying...'; setTimeout(connectWS, 2000); };
  ws.onmessage = e => {
    logBox.innerHTML += (e.data + '\n').replace(/\n/g,'<br>');
    logBox.scrollTop = logBox.scrollHeight;
  };
}
connectWS();

document.getElementById('btnReboot').onclick = ()=> ws.send('reboot');
document.getElementById('btnOn').onclick     = ()=> ws.send('led_on');
document.getElementById('btnOff').onclick    = ()=> ws.send('led_off');
</script>
</body>
</html>
